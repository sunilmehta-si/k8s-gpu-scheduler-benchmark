<svg xmlns="http://www.w3.org/2000/svg" width="560" height="484" viewBox="0 0 560 484" role="img" aria-labelledby="title desc">
<title id="title">256-GPU fleet, 131 jobs (reference simulation)</title>
<desc id="desc">Bar charts comparing default, kueue, volcano, kai. Shorter bars are better; the best stack is green.</desc>
<style>
.t{font:600 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1f2328}
.l{font:13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1f2328}
.v{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#59636e}
.n{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#59636e}
.b{fill:#2f6fde}.best{fill:#1a7f37}.g{stroke:#d1d9e0}
@media (prefers-color-scheme: dark){.t,.l{fill:#f0f6fc}.v,.n{fill:#9198a1}.b{fill:#4493f8}.best{fill:#3fb950}.g{stroke:#3d444d}}
</style>
<text class="t" x="0" y="18">256-GPU fleet, 131 jobs (reference simulation)</text>
<text class="l" x="0" y="50">Cost per useful GPU-hour <tspan class="n">(lower is better)</tspan></text>
<line class="g" x1="90" y1="58" x2="90" y2="152"/>
<text class="n" x="82" y="75" text-anchor="end">default</text>
<rect class="b" x="90" y="63" width="320" height="16" rx="3"/>
<text class="v" x="416" y="75">$5.09</text>
<text class="n" x="82" y="99" text-anchor="end">kueue</text>
<rect class="b" x="90" y="87" width="330" height="16" rx="3"/>
<text class="v" x="426" y="99">$5.25</text>
<text class="n" x="82" y="123" text-anchor="end">volcano</text>
<rect class="best" x="90" y="111" width="245" height="16" rx="3"/>
<text class="v" x="341" y="123">$3.90</text>
<text class="n" x="82" y="147" text-anchor="end">kai</text>
<rect class="best" x="90" y="135" width="245" height="16" rx="3"/>
<text class="v" x="341" y="147">$3.90</text>
<text class="l" x="0" y="198">Time to finish all work <tspan class="n">(lower is better)</tspan></text>
<line class="g" x1="90" y1="206" x2="90" y2="300"/>
<text class="n" x="82" y="223" text-anchor="end">default</text>
<rect class="b" x="90" y="211" width="320" height="16" rx="3"/>
<text class="v" x="416" y="223">26.0 h</text>
<text class="n" x="82" y="247" text-anchor="end">kueue</text>
<rect class="b" x="90" y="235" width="330" height="16" rx="3"/>
<text class="v" x="426" y="247">26.9 h</text>
<text class="n" x="82" y="271" text-anchor="end">volcano</text>
<rect class="best" x="90" y="259" width="245" height="16" rx="3"/>
<text class="v" x="341" y="271">19.9 h</text>
<text class="n" x="82" y="295" text-anchor="end">kai</text>
<rect class="best" x="90" y="283" width="245" height="16" rx="3"/>
<text class="v" x="341" y="295">19.9 h</text>
<text class="l" x="0" y="346">Queue wait p95 <tspan class="n">(lower is better)</tspan></text>
<line class="g" x1="90" y1="354" x2="90" y2="448"/>
<text class="n" x="82" y="371" text-anchor="end">default</text>
<rect class="b" x="90" y="359" width="330" height="16" rx="3"/>
<text class="v" x="426" y="371">698 min</text>
<text class="n" x="82" y="395" text-anchor="end">kueue</text>
<rect class="b" x="90" y="383" width="282" height="16" rx="3"/>
<text class="v" x="378" y="395">596 min</text>
<text class="n" x="82" y="419" text-anchor="end">volcano</text>
<rect class="b" x="90" y="407" width="86" height="16" rx="3"/>
<text class="v" x="182" y="419">183 min</text>
<text class="n" x="82" y="443" text-anchor="end">kai</text>
<rect class="best" x="90" y="431" width="58" height="16" rx="3"/>
<text class="v" x="154" y="443">122 min</text>
</svg>
