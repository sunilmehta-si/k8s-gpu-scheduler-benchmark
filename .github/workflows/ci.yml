name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so the pin drift report in the summary stays current when nothing is pushed.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - name: Unit tests (also check that committed traces and results are reproducible)
        run: python -W error::SyntaxWarning -m unittest discover -s tests -t . -v

  package:
    # Installs the built wheel, not the checkout, and runs the full pipeline from it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps -w dist .
      - name: Simulate, report and render manifests from the installed wheel
        run: |
          python -m venv /tmp/gsb && /tmp/gsb/bin/pip install --quiet dist/*.whl
          /tmp/gsb/bin/gsb --version
          /tmp/gsb/bin/gsb simulate --fleet fleets/lab-32.yaml --trace traces/lab-32-8h.jsonl -o /tmp/r.json
          /tmp/gsb/bin/gsb report /tmp/r.json > /tmp/r.md && grep -q "| Metric | default | kueue | volcano | kai |" /tmp/r.md
          for s in default kueue volcano kai; do
            /tmp/gsb/bin/gsb manifests --stack "$s" --fleet fleets/lab-32.yaml --trace traces/lab-32-8h.jsonl --speedup 60 > "/tmp/$s.yaml"
          done
          /tmp/gsb/bin/gsb fleet render fleets/mixed-256.yaml > /tmp/nodes.yaml

  versions:
    # Which pinned schedulers and tools have newer releases upstream, in the run's summary. It reports and does not
    # fail the build: a new upstream release, or the API being unreachable, is not a defect in this repository.
    # The weekly schedule exists for this job: the tests do not change between pushes, the releases do.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Compare the pins with upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gsb versions -o "$GITHUB_STEP_SUMMARY"
