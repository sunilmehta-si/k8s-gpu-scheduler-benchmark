name: cluster

# Replays the smoke trace on a real kind cluster with kwok GPU nodes, once per scheduling stack (as installed,
# and the tuned variants configured to bin-pack GPUs), and puts the cluster results next to the model's
# prediction for the same trace.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: cluster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: [default, kueue, volcano, kai, default-binpack, kueue-binpack, volcano-binpack]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Pins from cluster/versions.env
        run: grep -E '^[A-Z_]+=' cluster/versions.env >> "$GITHUB_ENV"
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: gsb
          config: cluster/kind.yaml
          # Without these the action's defaults decide the kind release and Kubernetes version.
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
      - name: Install kwok
        run: |
          scripts/cluster-up.sh
          kubectl get stages.kwok.x-k8s.io -o custom-columns=NAME:.metadata.name,DELAY_FROM:.spec.delay.durationFrom.expressionFrom
      - name: Install the scheduler
        if: matrix.stack != 'default'
        run: scripts/install-${{ matrix.stack }}.sh
      - name: Replay the smoke trace on the cluster
        env:
          STACK: ${{ matrix.stack }}
        run: |
          gsb cluster run --stack "$STACK" --fleet fleets/lab-32.yaml --trace traces/lab-32-smoke.jsonl \
            --speedup 300 --timeout 900 --strict -o "cluster-$STACK.json"
          gsb simulate --stacks "$STACK" --fleet fleets/lab-32.yaml --trace traces/lab-32-smoke.jsonl --placements \
            -o "model-$STACK.json"
          {
            echo "### $STACK on a kind + kwok cluster"; gsb report "cluster-$STACK.json"
            echo "### $STACK in the reference model"; gsb report "model-$STACK.json"
            gsb compare "model-$STACK.json" "cluster-$STACK.json"
            gsb timeline "cluster-$STACK.json" --stack "$STACK"; gsb timeline "model-$STACK.json" --stack "$STACK"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Evidence from the cluster
        if: always()
        run: |
          kubectl get pods -A -l gsb.io/job -o json | jq -r '.items[:6][] | [.metadata.name,
            (.metadata.annotations["pod-complete.stage.kwok.x-k8s.io/delay"] // "-"), .status.phase,
            (.status.startTime // "-"), ([.status.containerStatuses[]?.state.terminated.finishedAt] | first // "-")] | @tsv' || true
      - name: Keep the raw evidence
        if: always()
        env:
          STACK: ${{ matrix.stack }}
        run: |
          mkdir -p evidence
          kubectl get pods -A -l gsb.io/job -o json > "evidence/pods-$STACK.json" || true
          kubectl get events -A --sort-by=.lastTimestamp -o json > "evidence/events-$STACK.json" || true
          for ns in kueue-system volcano-system kai-scheduler kube-system; do
            for deploy in $(kubectl -n "$ns" get deploy -o name 2>/dev/null | grep -i -E 'sched|manager|controller'); do
              kubectl -n "$ns" logs "$deploy" --tail=3000 > "evidence/$ns-${deploy#deployment.apps/}.log" 2>/dev/null || true
            done
          done
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get nodes -o wide | head -20 || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cluster-${{ matrix.stack }}
          path: |
            cluster-*.json
            model-*.json
            evidence/
          if-no-files-found: ignore
